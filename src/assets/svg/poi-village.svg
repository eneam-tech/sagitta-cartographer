  <path d="M25 84 L25 74 M35 84 L35 74" stroke="#6E372D" stroke-width="2.2" stroke-linecap="round"/>
  <polygon points="21,75 30,68 39,75" fill="#8B493D" stroke="#263C40" stroke-width="2.2" stroke-linejoin="round"/>
