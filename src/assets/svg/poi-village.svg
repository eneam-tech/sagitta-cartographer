  <path d="M98 87 Q100 78 106 79 Q113 77 114 86 Q112 91 100 91 Z" fill="#334E3D" stroke="#263C40" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Casa principale in primo piano (a graticcio con tetto di paglia) -->
  <polygon points="43,66 72,66 72,94 43,94" fill="#F3EEDF" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>
  <polygon points="72,66 86,69 86,91 72,94" fill="#7B7880" stroke="#263C40" stroke-width="2.6" stroke-linejoin="round"/>
