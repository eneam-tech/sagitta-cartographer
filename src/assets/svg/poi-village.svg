  <polygon points="75,54 96,54 96,79 75,79" fill="#E8D8AF" stroke="#263C40" stroke-width="2.6" stroke-linejoin="round"/>
  <polygon points="96,54 106,56 106,77 96,79" fill="#7B7880" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <polygon points="72,55 85,39 99,55" fill="#8B493D" stroke="#263C40" stroke-width="2.6" stroke-linejoin="round"/>
  <polygon points="85,39 99,55 109,57 96,41" fill="#6E372D" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <rect x="82" y="61" width="5" height="6" rx="1" fill="#E0BB79" stroke="#263C40" stroke-width="1.8"/>

