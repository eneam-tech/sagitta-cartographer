<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Villaggio">
  <!-- Ombra a terra -->
  <ellipse cx="66" cy="97" rx="47" ry="11" fill="#263C40" opacity="0.22"/>

  <!-- Radura erbosa e sentiero -->
