  <path d="M30 47 L39 47 M27 51 L41 51" stroke="#263C40" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <rect x="31" y="59" width="5" height="6" rx="1" fill="#E0BB79" stroke="#263C40" stroke-width="1.8"/>

