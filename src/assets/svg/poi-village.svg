  <path d="M43 75 L72 75 M50 66 L50 94 M65 66 L65 94" stroke="#6E372D" stroke-width="2" stroke-linecap="round"/>
  <!-- Tetto di paglia spiovente -->
  <polygon points="39,67 57.5,45 76,67" fill="#E0BB79" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>
  <polygon points="57.5,45 76,67 90,69 72,48" fill="#D9C598" stroke="#263C40" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M51 56 L64 56 M46 61 L69 61 M67 52 L77 54 M71 58 L82 60" stroke="#263C40" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
