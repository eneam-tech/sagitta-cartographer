  <path d="M40 99 Q62 94 74 87 L82 88 Q70 96 53 102 Z" fill="#D9C598" opacity="0.9"/>

  <!-- Casetta posteriore sinistra con camino fumante -->
  <path d="M35 28 Q33 23 37 20 Q41 18 39 14" fill="none" stroke="#F3EEDF" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
  <rect x="33" y="31" width="5" height="13" fill="#8B493D" stroke="#263C40" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="24,52 44,52 44,76 24,74" fill="#F3EEDF" stroke="#263C40" stroke-width="2.6" stroke-linejoin="round"/>
  <polygon points="44,52 54,54 54,75 44,76" fill="#7B7880" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
