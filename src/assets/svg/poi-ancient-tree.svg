<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Albero sacro">
  <!-- Ombra a terra -->
  <ellipse cx="66" cy="99" rx="45" ry="10" fill="#263C40" opacity="0.24"/>

  <!-- Zolla erbosa e radici nodose dell'albero antico -->
  <ellipse cx="64" cy="96" rx="34" ry="7.5" fill="#D9C598" stroke="#263C40" stroke-width="2.2"/>

  <!-- Tronco possente e rami principali -->
  <path d="M39 97 Q49 90 52 72 L45 55 L53 51 L57 62 L63 49 L68 62 L75 51 L83 55 L76 72 Q79 90 90 97 Q75 94 69 98 Q64 93 58 98 Q52 94 39 97 Z" fill="#D9C598" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Luce NW e corteccia in ombra SE -->
  <path d="M41 96 Q51 89 53 71 L47 56 L53 53 L57 69 Q56 86 48 94 Z" fill="#F3EEDF"/>
  <path d="M68 62 L75 52 L82 56 L75 72 Q78 89 89 96 Q78 93 70 96 Z" fill="#7D5C43"/>
  <path d="M56 76 Q58 66 57 59 M65 89 Q66 78 65 69" fill="none" stroke="#6E372D" stroke-width="2" stroke-linecap="round"/>
  <path d="M39 97 Q49 90 52 72 L45 55 L53 51 L57 62 L63 49 L68 62 L75 51 L83 55 L76 72 Q79 90 90 97 Q75 94 69 98 Q64 93 58 98 Q52 94 39 97 Z" fill="none" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Piccolo santuario dorato / lanterna fra le radici -->
  <path d="M59 95 L59 83 Q64 77 69 83 L69 95 Z" fill="#263C40"/>
  <circle cx="64" cy="87" r="3" fill="#E0BB79"/>
  <circle cx="64" cy="87" r="1.3" fill="#F3EEDF"/>

  <!-- Massa inferiore di chioma in ombra -->
