  <!-- Masse di chioma medie in luce -->
  <path d="M24 55 Q20 42 33 36 Q40 24 56 28 Q64 14 75 26 Q92 25 97 39 Q108 46 100 57 Q89 63 77 56 Q64 62 50 56 Q35 63 24 55 Z" fill="#486953" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Cime superiori illuminate da NW -->
  <path d="M34 38 Q39 24 53 26 Q63 14 74 25 Q86 24 89 35 Q76 41 64 37 Q49 43 34 38 Z" fill="#A8B97E" stroke="#263C40" stroke-width="2" stroke-linejoin="round"/>
