  <path d="M68 48 Q77 42 87 47 Q94 46 98 52" fill="none" stroke="#263C40" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Fiori e gemme dorate fra le fronde -->
  <circle cx="43" cy="34" r="2.3" fill="#E0BB79"/>
  <circle cx="64" cy="24" r="2.5" fill="#E0BB79"/>
  <circle cx="79" cy="34" r="2.2" fill="#E0BB79"/>
  <circle cx="35" cy="49" r="2.1" fill="#E0BB79"/>
  <circle cx="57" cy="46" r="2.3" fill="#E0BB79"/>
  <circle cx="89" cy="49" r="2.1" fill="#E0BB79"/>
</svg>
