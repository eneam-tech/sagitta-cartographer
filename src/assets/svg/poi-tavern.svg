<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Locanda">
  <!-- Ombra a terra -->
  <ellipse cx="64" cy="98" rx="44" ry="10" fill="#263C40" opacity="0.24"/>

  <!-- Piazzola in ciottoli davanti alla locanda -->
  <ellipse cx="60" cy="94" rx="41" ry="8" fill="#D9C598" stroke="#263C40" stroke-width="2.4"/>

  <!-- Camino e sbuffi di fumo caldo -->
  <path d="M35 28 Q33 21 38 18 Q42 15 40 11" fill="none" stroke="#F3EEDF" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <rect x="32" y="30" width="8" height="18" fill="#7B7880" stroke="#263C40" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Piano terra in pietra -->
  <polygon points="24,64 68,64 68,94 24,94" fill="#B9B1AA" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>
  <polygon points="68,64 88,61 88,91 68,94" fill="#7B7880" stroke="#263C40" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Secondo piano sporgente a graticcio -->
  <polygon points="20,44 71,44 71,65 20,65" fill="#F3EEDF" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>
  <polygon points="71,44 91,42 91,62 71,65" fill="#E8D8AF" stroke="#263C40" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Travi scure a graticcio -->
  <path d="M29 44 L29 65 M46 44 L46 65 M62 44 L62 65 M20 55 L71 55 M71 53 L91 51 M81 43 L81 63" stroke="#6E372D" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Grande tetto spiovente con abbaino -->
  <polygon points="16,46 45.5,22 75,46" fill="#8B493D" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>
  <polygon points="45.5,22 75,46 95,43 68,21" fill="#6E372D" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Abbaino frontale -->
  <polygon points="36,38 45.5,29 55,38" fill="#F3EEDF" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <circle cx="45.5" cy="35" r="2.2" fill="#E0BB79" stroke="#263C40" stroke-width="1.5"/>

  <!-- Porta accogliente e finestre illuminate d'ambra -->
  <path d="M36 94 L36 77 Q43 70 50 77 L50 94 Z" fill="#6E372D" stroke="#263C40" stroke-width="2.4"/>
  <path d="M43 73 L43 94" stroke="#263C40" stroke-width="1.6"/>
  <rect x="55" y="72" width="8" height="9" rx="1.5" fill="#E0BB79" stroke="#263C40" stroke-width="2"/>
  <path d="M59 72 L59 81 M55 76.5 L63 76.5" stroke="#263C40" stroke-width="1.4"/>
  <rect x="33" y="48" width="9" height="9" rx="1.5" fill="#E0BB79" stroke="#263C40" stroke-width="2"/>
  <rect x="50" y="48" width="9" height="9" rx="1.5" fill="#E0BB79" stroke="#263C40" stroke-width="2"/>

  <!-- Botti di birra accanto all'ingresso -->
  <ellipse cx="25" cy="87" rx="5.5" ry="7.5" fill="#8B493D" stroke="#263C40" stroke-width="2.2"/>
  <path d="M20 84 L30 84 M20 90 L30 90" stroke="#263C40" stroke-width="1.8"/>
  <ellipse cx="77" cy="88" rx="5" ry="6.5" fill="#7D5C43" stroke="#263C40" stroke-width="2.2"/>
  <path d="M72.5 85 L81.5 85 M72.5 91 L81.5 91" stroke="#263C40" stroke-width="1.8"/>

  <!-- Braccio in ferro battuto e insegna sporgente della locanda -->
  <path d="M88 53 L112 53 L112 57" fill="none" stroke="#263C40" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M89 59 L97 53" fill="none" stroke="#263C40" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="93" y="57" width="21" height="19" rx="2.5" fill="#E0BB79" stroke="#263C40" stroke-width="2.6"/>
  <!-- Boccale inciso sull'insegna -->
  <rect x="98.5" y="62" width="8" height="10" rx="1.2" fill="#8B493D" stroke="#263C40" stroke-width="1.8"/>
  <path d="M106.5 64.5 Q110.5 64.5 110.5 67.5 Q110.5 70.5 106.5 70.5" fill="none" stroke="#263C40" stroke-width="1.8"/>
  <path d="M98.5 62 Q102.5 59.5 106.5 62" fill="#F3EEDF" stroke="#263C40" stroke-width="1.4"/>
</svg>
