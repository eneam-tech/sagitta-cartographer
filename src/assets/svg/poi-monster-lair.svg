  <polygon points="69,51 74,65 78,54" fill="#8C8986" stroke="#21150C" stroke-width="1.5"/>

  <!-- Emblema d'allerta / teschio simbolico scolpito davanti all'ingresso -->
  <circle cx="64" cy="80" r="7" fill="#EADAB2" stroke="#21150C" stroke-width="2"/>
  <circle cx="61.5" cy="79" r="1.5" fill="#21150C"/>
  <circle cx="66.5" cy="79" r="1.5" fill="#21150C"/>
  <path d="M54 94 L74 88 M54 88 L74 94" stroke="#9E3224" stroke-width="2.4" stroke-linecap="round"/>
</svg>
