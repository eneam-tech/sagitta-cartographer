<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Tana oscura">
  <!-- Ombra a terra -->
  <ellipse cx="64" cy="97" rx="46" ry="12" fill="#21150C" opacity="0.32"/>

  <!-- Rupe frastagliata con anfratto oscuro -->
  <path d="M18 92 L32 48 L48 34 L66 24 L86 38 L104 60 L110 92 Z" fill="#6C5D4F" stroke="#21150C" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M66 24 L86 38 L104 60 L110 92 L68 92 Z" fill="#463B32"/>
  <path d="M18 92 L32 48 L48 34 L66 24 L86 38 L104 60 L110 92 Z" fill="none" stroke="#21150C" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Apertura cavernosa seghettata -->
  <path d="M40 92 C40 62 50 50 64 50 C78 50 88 62 88 92 Z" fill="#17232D" stroke="#21150C" stroke-width="2.6"/>
  <!-- Zanne/stalattiti all'ingresso -->
