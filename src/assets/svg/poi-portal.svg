  <path d="M40 54 L42 58 L39 61 M88 54 L86 58 L89 61 M49 34 L53 36 M79 34 L75 36" fill="none" stroke="#E0BB79" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

