  <polygon points="38,24 49,26.5 38,29" fill="#E0BB79" stroke="#263C40" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Vele quadre gonfie dal vento -->
  <!-- Trinchetto -->
  <path d="M27 33 L49 33 Q44 45 48 56 L24 56 Q22 44 27 33 Z" fill="#F3EEDF" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M40 33 L49 33 Q44 45 48 56 L41 56 Q39 45 40 33 Z" fill="#D9C598"/>
  <path d="M27 33 L49 33 Q44 45 48 56 L24 56 Q22 44 27 33 Z" fill="none" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Vela di gabbia alta (maestro) -->
  <path d="M51 22 L73 22 Q68 30 72 37 L49 37 Q47 29 51 22 Z" fill="#F3EEDF" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Grande vela maestra con croce/banda rossa -->
  <path d="M47 40 L77 40 Q71 53 75 66 L44 66 Q41 53 47 40 Z" fill="#F3EEDF" stroke="#263C40" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M67 40 L77 40 Q71 53 75 66 L66 66 Q63 53 67 40 Z" fill="#D9C598"/>
  <path d="M58 43 L62 43 L60 63 L56 63 Z" fill="#8B493D" opacity="0.88"/>
  <path d="M47 40 L77 40 Q71 53 75 66 L44 66 Q41 53 47 40 Z" fill="none" stroke="#263C40" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- Vela latina di mezzana -->
  <path d="M77 35 L99 37 Q93 49 96 60 L77 58 Z" fill="#E8D8AF" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Scafo del galeone con castello di poppa -->
