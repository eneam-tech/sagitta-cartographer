  <path d="M26 73 L47 73 L51 76 L80 75 L88 65 L107 65 L106 70 L90 70 L81 79 L49 80 L45 77 L28 77 Z" fill="#E8D8AF" stroke="#263C40" stroke-width="2" stroke-linejoin="round"/>
  <!-- Carena in ombra SE -->
  <polygon points="62,84 103,81 101,91 58,92" fill="#6E372D"/>
  <!-- Oblò dorati e fanale di poppa -->
  <circle cx="48" cy="84" r="2.1" fill="#E0BB79" stroke="#263C40" stroke-width="1.2"/>
  <circle cx="59" cy="84" r="2.1" fill="#E0BB79" stroke="#263C40" stroke-width="1.2"/>
  <circle cx="70" cy="84" r="2.1" fill="#E0BB79" stroke="#263C40" stroke-width="1.2"/>
  <circle cx="81" cy="83" r="2.1" fill="#E0BB79" stroke="#263C40" stroke-width="1.2"/>
  <rect x="92" y="72" width="7" height="5" rx="1" fill="#E0BB79" stroke="#263C40" stroke-width="1.4"/>
  <circle cx="107" cy="61" r="2.8" fill="#E0BB79" stroke="#263C40" stroke-width="1.6"/>
  <path d="M25 73 L46 73 L50 76 L79 75 L88 65 L107 65 L101 91 L36 92 L25 73 Z" fill="none" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Onde e spuma sotto la chiglia -->
  <path d="M16 94 Q28 90 40 94 T64 94 T88 94 T112 94" fill="none" stroke="#263C40" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M21 90 Q28 87 35 91" fill="none" stroke="#F3EEDF" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M26 101 Q46 98 66 101 T106 100" fill="none" stroke="#7BA1A1" stroke-width="2.2" stroke-linecap="round"/>
</svg>
