<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Galeone">
  <!-- Specchio d'acqua e scia marina -->
  <ellipse cx="64" cy="97" rx="49" ry="11" fill="#A8C8C6" opacity="0.7"/>
  <ellipse cx="64" cy="95" rx="39" ry="7" fill="#5E95A0" opacity="0.4"/>

  <!-- Bompresso e vela di fiocco a sinistra -->
  <path d="M31 73 L12 63" stroke="#6E372D" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M31 73 L12 63" stroke="#263C40" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M15 64 L36 33 L33 67 Z" fill="#F3EEDF" stroke="#263C40" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Alberi maestro, trinchetto e mezzana -->
