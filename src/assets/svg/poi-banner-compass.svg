<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Rosa con cartiglio">
  <!-- Raggi cardinali sottili di orientamento -->
  <path d="M52 8 V120 M6 64 H100 M19 31 L85 97 M85 31 L19 97" stroke="#21150C" stroke-width="1.3" opacity="0.55"/>

  <!-- Anello ottone della rosa -->
  <circle cx="52" cy="64" r="32" fill="#EADAB2" fill-opacity="0.22" stroke="#21150C" stroke-width="2.4"/>
  <circle cx="52" cy="64" r="26" fill="none" stroke="#21150C" stroke-width="1.6"/>

  <!-- Stella a otto punte -->
  <polygon points="52,64 44,56 30,42" fill="#F3EEDF" stroke="#21150C" stroke-width="1.8"/>
  <polygon points="52,64 52,52 30,42" fill="#846233" stroke="#21150C" stroke-width="1.8"/>
  <polygon points="52,64 52,52 74,42" fill="#F3EEDF" stroke="#21150C" stroke-width="1.8"/>
  <polygon points="52,64 60,56 74,42" fill="#846233" stroke="#21150C" stroke-width="1.8"/>
  <polygon points="52,64 60,72 74,86" fill="#846233" stroke="#21150C" stroke-width="1.8"/>
  <polygon points="52,64 52,76 74,86" fill="#21150C" stroke="#21150C" stroke-width="1.8"/>
  <polygon points="52,64 44,72 30,86" fill="#F3EEDF" stroke="#21150C" stroke-width="1.8"/>
  <polygon points="52,64 52,76 30,86" fill="#846233" stroke="#21150C" stroke-width="1.8"/>

  <!-- Quattro punte principali -->
  <polygon points="52,64 44,56 52,18" fill="#F3EEDF" stroke="#21150C" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="52,64 60,56 52,18" fill="#9E3224" stroke="#21150C" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="52,64 44,72 52,108" fill="#F3EEDF" stroke="#21150C" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="52,64 60,72 52,108" fill="#21150C" stroke="#21150C" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="52,64 44,56 12,64" fill="#F3EEDF" stroke="#21150C" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="52,64 44,72 12,64" fill="#21150C" stroke="#21150C" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="52,64 60,56 90,64" fill="#F3EEDF" stroke="#21150C" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="52,64 60,72 90,64" fill="#21150C" stroke="#21150C" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Cartiglio svolazzante in pergamena a destra -->
  <path d="M56 72 C76 66 94 74 118 68 L112 79 L118 88 C94 94 76 86 56 92 Z" fill="#EADAB2" stroke="#21150C" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M68 79 H104 M72 84 H98" stroke="#5A4125" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Borchia centrale -->
  <circle cx="52" cy="64" r="7.5" fill="#E0BB79" stroke="#21150C" stroke-width="2.2"/>
  <circle cx="52" cy="64" r="3" fill="#9E3224"/>
</svg>
