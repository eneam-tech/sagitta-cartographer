<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Mulino a vento">
  <!-- Ombra a terra -->
  <ellipse cx="66" cy="99" rx="44" ry="10" fill="#263C40" opacity="0.22"/>

  <!-- Poggio dorato di grano -->
  <path d="M18 98 Q42 84 64 85 Q88 85 110 98 Q84 103 44 103 Z" fill="#D9C598" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M24 94 Q32 88 38 93" fill="none" stroke="#486953" stroke-width="3" stroke-linecap="round"/>
  <path d="M90 94 Q97 87 104 94" fill="none" stroke="#486953" stroke-width="3" stroke-linecap="round"/>

  <!-- Piccolo granaio laterale -->
  <polygon points="24,81 44,81 44,96 24,96" fill="#E8D8AF" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <polygon points="22,82 34,72 46,82" fill="#8B493D" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Torre troncoconica del mulino -->
  <polygon points="44,96 51,42 77,42 84,96 64,99" fill="#F3EEDF"/>
  <polygon points="67,42 77,42 84,96 68,98" fill="#7B7880"/>
  <polygon points="73,42 77,42 84,96 76,97" fill="#5F5D65"/>
  <polygon points="44,96 51,42 77,42 84,96 64,99" fill="none" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Porta del mulino e finestrella -->
  <path d="M58 98 L58 83 Q64 77 70 83 L70 98 Z" fill="#6E372D" stroke="#263C40" stroke-width="2.4"/>
  <rect x="61" y="61" width="6" height="8" rx="1.5" fill="#E0BB79" stroke="#263C40" stroke-width="1.8"/>

  <!-- Cupola conica rotante -->
  <polygon points="48,43 64,25 80,43" fill="#8B493D"/>
  <polygon points="64,25 80,43 69,43" fill="#6E372D"/>
  <polygon points="48,43 64,25 80,43" fill="none" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Quattro grandi pale a croce diagonale -->
  <!-- Pala in alto a sinistra -->
  <polygon points="61,40 31,14 25,20 55,46" fill="#F3EEDF" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Pala in alto a destra -->
  <polygon points="67,40 97,14 103,20 73,46" fill="#E8D8AF" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Pala in basso a sinistra -->
  <polygon points="61,48 31,74 25,68 55,42" fill="#E8D8AF" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Pala in basso a destra -->
  <polygon points="67,48 97,74 103,68 73,42" fill="#D9C598" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Tralicci e aste portanti delle pale -->
  <path d="M26 15 L102 73 M102 15 L26 73" stroke="#6E372D" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M26 15 L102 73 M102 15 L26 73" stroke="#263C40" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M35 22 L40 17 M43 28 L48 23 M85 28 L80 23 M93 22 L88 17 M35 66 L40 71 M43 60 L48 65 M85 60 L80 65 M93 66 L88 71" stroke="#263C40" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>

  <!-- Mozzo centrale in ottone -->
  <circle cx="64" cy="44" r="5.5" fill="#E0BB79" stroke="#263C40" stroke-width="2.6"/>
  <circle cx="64" cy="44" r="2" fill="#263C40"/>
</svg>
