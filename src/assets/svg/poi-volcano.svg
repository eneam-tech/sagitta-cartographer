<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Vulcano">
  <!-- Ombra a terra -->
  <ellipse cx="64" cy="99" rx="48" ry="10" fill="#263C40" opacity="0.26"/>

  <!-- Pennacchio di cenere e fumo che sale verso nord-est -->
  <path d="M56 36 Q47 26 56 18 Q63 11 75 14 Q86 10 95 18 Q105 21 102 31 Q95 38 82 34 Q75 39 67 36 Z" fill="#B9B1AA" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M58 28 Q56 19 66 16 Q73 14 82 18" fill="none" stroke="#F3EEDF" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M74 32 Q84 35 94 31 Q100 28 99 22" fill="none" stroke="#7B7880" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Faville ardenti -->
  <circle cx="51" cy="24" r="2.2" fill="#F4A236"/>
  <circle cx="68" cy="24" r="2.5" fill="#C94A28"/>
  <circle cx="88" cy="24" r="2" fill="#F4A236"/>

  <!-- Cono vulcanico ripido -->
  <polygon points="15,96 48,41 80,41 113,96 86,100 40,100" fill="#7B7880" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>
  <!-- Fianco sinistro illuminato da NW per risaltare su fondi scuri -->
  <polygon points="15,96 48,41 59,44 50,70 43,99" fill="#B9B1AA"/>
  <polygon points="19,95 48,42 52,44 31,96" fill="#E8D8AF" opacity="0.75"/>
  <!-- Fianco destro in ombra lavica -->
  <polygon points="70,42 80,41 113,96 86,100 72,72" fill="#5F5D65"/>

  <!-- Bocca del cratere ardente -->
  <path d="M47 41 L54 45 L62 41 L71 45 L80 41 L77 36 L65 38 L53 36 Z" fill="#C94A28" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <ellipse cx="64" cy="40" rx="12" ry="3.5" fill="#F4A236"/>
  <ellipse cx="63" cy="40" rx="6" ry="1.8" fill="#E0BB79"/>

  <!-- Colate di magma incandescente lungo il pendio -->
  <path d="M56 44 Q52 58 58 68 Q62 78 52 96 L60 97 Q69 79 65 67 Q60 56 63 44 Z" fill="#C94A28" stroke="#263C40" stroke-width="2" stroke-linejoin="round"/>
  <path d="M59 45 Q56 58 61 68 Q64 78 56 95" fill="none" stroke="#F4A236" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M71 44 Q78 57 76 68 Q75 76 82 84 L86 82 Q80 74 81 66 Q82 55 75 43 Z" fill="#F4A236" stroke="#263C40" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Creste di roccia scura e contorno finale -->
  <path d="M36 74 L44 60 M91 74 L84 61" fill="none" stroke="#263C40" stroke-width="2" stroke-linecap="round"/>
  <polygon points="15,96 48,41 55,44 63,41 72,44 80,41 113,96 86,100 40,100" fill="none" stroke="#263C40" stroke-width="2.8" stroke-linejoin="round"/>
</svg>
