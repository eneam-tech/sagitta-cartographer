  <path d="M98 55 L98 25 L88 25" fill="none" stroke="#6E372D" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M98 55 L98 25 L88 25" fill="none" stroke="#263C40" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M91 25 L91 31" stroke="#263C40" stroke-width="1.8"/>
  <polygon points="87,31 95,31 94,40 88,40" fill="#E0BB79" stroke="#263C40" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="91" cy="35.5" r="2" fill="#F3EEDF"/>

