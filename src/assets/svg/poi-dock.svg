  <rect x="37" y="55" width="12" height="11" rx="1.5" fill="#D9C598" stroke="#263C40" stroke-width="2.2"/>
  <path d="M37 55 L49 66" stroke="#263C40" stroke-width="1.6"/>
  <ellipse cx="56" cy="56" rx="5.5" ry="7" fill="#8B493D" stroke="#263C40" stroke-width="2.2"/>
  <path d="M51 54 L61 54 M51 58 L61 58" stroke="#263C40" stroke-width="1.6"/>

