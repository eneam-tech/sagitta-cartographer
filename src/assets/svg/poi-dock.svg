  <path d="M15 95 Q28 74 44 68 L18 65 Q13 78 15 95 Z" fill="#EFE4C8" stroke="#263C40" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M16 74 Q22 65 30 69 Q34 62 40 69" fill="none" stroke="#486953" stroke-width="3" stroke-linecap="round"/>

  <!-- Palafitte posteriori del molo -->
