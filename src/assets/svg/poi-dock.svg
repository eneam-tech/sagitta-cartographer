  <rect x="36" y="76" width="5" height="15" rx="1" fill="#6E372D" stroke="#263C40" stroke-width="2.2"/>
  <rect x="57" y="70" width="5" height="16" rx="1" fill="#6E372D" stroke="#263C40" stroke-width="2.2"/>
  <rect x="79" y="64" width="5" height="17" rx="1" fill="#6E372D" stroke="#263C40" stroke-width="2.2"/>
  <rect x="100" y="57" width="5.5" height="20" rx="1" fill="#6E372D" stroke="#263C40" stroke-width="2.2"/>

