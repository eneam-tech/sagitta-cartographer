  <rect x="74" y="54" width="4" height="6" rx="1" fill="#5F5D65" stroke="#263C40" stroke-width="1.8"/>
  <path d="M76 60 Q73 72 67 80" fill="none" stroke="#263C40" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Barca a remi ormeggiata accanto al pontile -->
  <path d="M46 86 Q64 81 84 85 L77 95 Q62 97 50 94 Z" fill="#8B493D" stroke="#263C40" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M50 86 Q64 83 80 86 L76 90 Q63 91 53 89 Z" fill="#E8D8AF" stroke="#263C40" stroke-width="1.8"/>
  <path d="M62 84 L62 91 M69 84 L69 91" stroke="#6E372D" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M65 89 L56 101" stroke="#D9C598" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M65 89 L56 101" stroke="#263C40" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Increspature d'acqua in primo piano -->
  <path d="M22 98 Q36 94 50 98 T78 98 T108 97" fill="none" stroke="#263C40" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M35 104 Q52 101 69 104 T103 103" fill="none" stroke="#5E95A0" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M84 89 Q94 86 104 89" fill="none" stroke="#F3EEDF" stroke-width="2" stroke-linecap="round"/>
