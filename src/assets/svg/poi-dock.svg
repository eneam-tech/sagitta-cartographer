  <rect x="53" y="64" width="5" height="16" rx="1" fill="#6E372D" stroke="#263C40" stroke-width="2"/>
  <rect x="74" y="59" width="5" height="18" rx="1" fill="#6E372D" stroke="#263C40" stroke-width="2"/>
  <rect x="94" y="55" width="5" height="20" rx="1" fill="#6E372D" stroke="#263C40" stroke-width="2"/>

